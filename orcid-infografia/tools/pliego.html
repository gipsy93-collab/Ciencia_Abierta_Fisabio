<!DOCTYPE html><html><head><meta charset="utf-8"><style>

</style></head><body>
<figure><canvas data-p="clones"></canvas><figcaption>01 clones</figcaption></figure>

<figure><canvas data-p="cuatro"></canvas><figcaption>04 cuatro pasos</figcaption></figure>
<figure><canvas data-p="visibilidad"></canvas><figcaption>05 visibilidad</figcaption></figure>
<figure><canvas data-p="archivo"></canvas><figcaption>06 archivo</figcaption></figure>
<figure><canvas data-p="red"></canvas><figcaption>07 red</figcaption></figure>
<figure><canvas data-p="fusion"></canvas><figcaption>08 fusion</figcaption></figure>
<script src="../src/arte/art.js"></script>
<script src="../src/arte/placas.js"></script>

document.querySelectorAll('canvas[data-p]').forEach(function(c){ Placas.pintar(c.getAttribute('data-p'), c); });
</script>
</body></html>

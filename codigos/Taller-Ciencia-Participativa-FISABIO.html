**Financia:** FECYT, convocatoria I+P.`,pullQuote:"Esta iniciativa constituye una palanca estratégica para la estandarización y consolidación de las prácticas de Ciencia Abierta en el ecosistema de I+D+i en salud de Valencia.",source:"Informe de Resultados, §1",nextStepId:"p_intro"},{id:"p_proposito",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:`El propósito central es sustentar el diseño de políticas estandarizadas y coherentes entre las instituciones investigadoras que soporta la **Dirección General de Investigación e Innovación (DGII)**.

Entre sus metas operativas: mandatos de acceso abierto a publicaciones y datos, estándares de calidad, indicadores cualitativos en los CRIS, incentivos y superación de impedimentos legales y estructurales.`,keyFinding:"La ciencia abierta no se pide como favor: se incorpora al diseño de las políticas.",nextStepId:"p_intro"},{id:"p_next",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"Con el marco claro, el siguiente paso es la sesión que lo puso a prueba: **el taller**."}]},{id:"station-taller",section:"contexto-taller",shortLabel:"Taller",title:"2. Contexto del taller",subtitle:"Cuándo, dónde y para qué",worldX:2300,accessHeight:165,climb:"climb_cart_table",color:{light:"rgba(255, 100, 125, 0.9)",dark:"rgba(255, 100, 125, 0.9)",accent:"#ff647d"},summary:"El 20 de octubre de 2026, en la Semana del Acceso Abierto, la Unidad de Ciencia Abierta de Fisabio reunió a investigadores, gestores y decisores para diagnosticar qué necesita la ciencia abierta en salud.",dialogueRoot:[{id:"t_intro",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"El **20 de octubre de 2026**, con motivo de la **Semana del Acceso Abierto**, la Unidad de Ciencia Abierta de Fisabio convocó a investigadores, gestores de investigación y responsables de la toma de decisiones públicas de siete entidades clave en salud pública.",pending:"Sede, formato y duración del taller.",options:[{text:"La pregunta",targetStepId:"t_pregunta"},{text:"Los dos momentos de la jornada",targetStepId:"t_momentos"},{text:"El método",targetStepId:"t_metodo"},{text:"Cerrar y seguir",targetStepId:"t_next"}]},{id:"t_pregunta",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:`**Objetivo general:** construir un diagnóstico compartido entre los diversos actores del sistema sobre las necesidades prioritarias para consolidar la Ciencia Abierta en el sector salud.

Para ello se buscó identificar necesidades existentes y emergentes, prioridades compartidas, factores que las explican, condiciones para el cambio, actores y alianzas, y una visión de futuro compartida.`,pullQuote:"qué se requiere para que la Ciencia Abierta avance de manera efectiva en el ámbito de la investigación sanitaria",source:"Informe de Resultados, §2",nextStepId:"t_intro"},{id:"t_momentos",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"La jornada tuvo dos momentos. Primero, el **taller participativo** para pensar cómo abordar las necesidades de la ciencia abierta. Después, la ponencia de **Enrique Orduña-Malea (UPV)** sobre los costes de la actividad investigadora, y la sesión de trabajo del grupo de **Documentación y Ciencia Abierta** impulsado por la Dirección General.",nextStepId:"t_intro"},{id:"t_metodo",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"**De barreras a necesidades.** Se diseñó un catálogo de necesidades en tarjetas codificadas por colores, dentro de **seis ejes temáticos** (N01–N25). De ahí se preseleccionaron **13 necesidades críticas** y, por votación, se eligieron **cuatro temáticas** para el análisis profundo.",keyFinding:"Primero se escucha; después se prioriza.",nextStepId:"t_intro"},{id:"t_next",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"Con la ficha clara, el siguiente paso es saber **quién estaba en la sala**."}]},{id:"station-participantes",section:"participantes",shortLabel:"Participantes",title:"3. Descripción de participantes",subtitle:"Quiénes y desde qué ámbitos",worldX:4100,accessHeight:170,climb:"shelf",color:{light:"rgba(99, 170, 22, 0.9)",dark:"rgba(99, 170, 22, 0.9)",accent:"#63aa16"},summary:"Siete entidades clave en salud pública y tres perfiles —investigadores, gestores de la investigación y responsables de decisiones— para construir un diagnóstico compartido.",dialogueRoot:[{id:"u_intro",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"Un taller se entiende por quienes lo habitan. Se reunió un grupo multidisciplinario de **siete entidades clave en el campo de la salud pública**.",options:[{text:"Los perfiles",targetStepId:"u_perfil"},{text:"Las siete entidades",targetStepId:"u_entidades"},{text:"Cerrar y seguir",targetStepId:"u_next"}]},{id:"u_perfil",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"Tres perfiles, una misma mesa. El taller buscaba un diagnóstico compartido, no tres diagnósticos separados.",pullQuote:"un grupo multidisciplinario conformado por investigadores/as, gestores/as de investigación y responsables de toma de decisiones públicas provenientes de siete entidades clave en el campo de la salud pública",source:"Informe de Resultados, §2",pending:"Número de asistentes, listado de las siete entidades y voces que no estuvieron.",nextStepId:"u_intro"},{id:"u_entidades",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"**Siete entidades** interesadas en pensar estrategias de ciencia abierta que puedan impactar a la sociedad. El informe las cuenta, pero aún no las nombra una por una.",pending:"Listado de las siete entidades y territorios representados.",nextStepId:"u_intro"},{id:"u_next",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"Las personas traen temas. Eso es la siguiente parada: **las temáticas que trabajaron**."}]},{id:"station-tematicas",section:"tematicas-trabajadas",shortLabel:"Temáticas",title:"4. Temáticas que trabajaron",subtitle:"Lo que se puso sobre la mesa",worldX:5900,accessHeight:200,climb:"climb_air_chain",color:{light:"rgba(235, 0, 59, 0.9)",dark:"rgba(235, 0, 59, 0.9)",accent:"#eb003b"},summary:"25 necesidades en seis ejes —de gobernanza a participación ciudadana— y 13 que pasaron a la votación. Esta estación admite fotos del mural, tarjetas o actas.",dialogueRoot:[{id:"v_intro",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"Esta estación recoge los temas que se pusieron sobre la mesa, tal como aparecieron, antes de priorizar. El orden importa: primero se escucha, después se elige.",options:[{text:"Los seis ejes",targetStepId:"v_ejes"},{text:"Las 13 necesidades",targetStepId:"v_lista"},{text:"Los materiales",targetStepId:"v_materiales"},{text:"Cerrar y seguir",targetStepId:"v_next"}]},{id:"v_ejes",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:`**Gobernanza y cultura** — N01–N03. Liderazgo, planes estratégicos y cambio de paradigma institucional.

**Recursos y capacidades** — N04–N06. Financiación dedicada y asignación de personal especializado.

**Formación e infraestructuras** — N07–N10. Capacitación, repositorios, plataformas e interoperabilidad técnica.

**Aspectos legales y éticos** — N11–N14. Protección de datos, propiedad intelectual, confidencialidad y ética.

**Incentivos y evaluación** — N15–N18. Reconocimiento en la carrera científica e indicadores cualitativos CoARA.

**Participación ciudadana** — N19–N25. Gobernanza compartida, inclusión de pacientes y ciencia ciudadana.`,source:"Síntesis del Informe de Resultados, §3",keyFinding:"Seis ejes, 25 necesidades: el mapa completo antes de recortar.",nextStepId:"v_intro"},{id:"v_lista",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:`De los seis ejes, los participantes preseleccionaron **13 necesidades críticas**:

• Estrategia institucional de ciencia abierta
• Financiación estable para impulsar la ciencia abierta
• Acceso equitativo a recursos e infraestructuras
• Infraestructuras tecnológicas adecuadas
• Interoperabilidad y estandarización de datos y sistemas
• Apoyo técnico para la preparación y anonimización de datos
• Orientación clara sobre protección de datos, propiedad intelectual y derechos de explotación
• Garantías para proteger la confidencialidad
• Procesos éticos y administrativos ágiles
• Reconocimiento de la ciencia abierta en la evaluación investigadora
• Incentivos para compartir resultados y recursos
• Estructuras estables de participación ciudadana
• Gobernanza compartida y toma de decisiones colaborativas`,pullQuote:"se diseñó un catálogo de necesidades agrupadas en tarjetas codificadas por colores dentro de seis ejes temáticos",source:"Informe de Resultados, §3",keyFinding:"13 de las 25 necesidades pasaron a la votación.",nextStepId:"v_intro"},{id:"v_materiales",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"El motor ya admite imágenes, vídeo y audio con pie de foto, crédito, subtítulos y transcripción. Aquí entrarán el mural, las tarjetas y las actas cuando estén disponibles.",pending:"Fotos, vídeo o audio del mural y de las tarjetas; actas del taller.",nextStepId:"v_intro"},{id:"v_next",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"No todo cabe. La siguiente estación explica **qué se seleccionó y por qué**."}]},{id:"station-prioridades",section:"tematicas-seleccionadas",shortLabel:"Prioridades",title:"5. Temáticas seleccionadas y focos",subtitle:"De la lista larga a los cuatro focos",worldX:7700,accessHeight:180,climb:"steps",color:{light:"rgba(29, 15, 68, 0.9)",dark:"rgba(29, 15, 68, 0.9)",accent:"#1d0f44"},summary:"De las 13 necesidades se votaron cuatro temáticas centrales. Los grupos las analizaron con el mismo esquema: diagnóstico actual, actores clave, transformación requerida y causas subyacentes.",dialogueRoot:[{id:"w_intro",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"Elige una para abrir sus apuntes. Las cuatro necesidades salieron de la votación y los grupos las analizaron con el mismo esquema.",pullQuote:"Mediante un proceso de votación participativa, se priorizaron cuatro temáticas centrales sobre las cuales se realizó un análisis profundo respecto a su diagnóstico actual, actores clave, transformaciones requeridas y causas subyacentes.",source:"Informe de Resultados, §4",pending:"Criterios explícitos de la votación y temáticas que quedaron fuera.",options:[{text:"Financiación estable",targetStepId:"w_financiacion"},{text:"Estrategia institucional",targetStepId:"w_estrategia"},{text:"Infraestructuras tecnológicas",targetStepId:"w_infraestructuras"},{text:"Gobernanza compartida",targetStepId:"w_gobernanza"},{text:"Cerrar y seguir",targetStepId:"w_next"}]},{id:"w_financiacion",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:`**1 · Financiación estable para impulsar la ciencia abierta**

**Diagnóstico actual.** Existe una demanda creciente en la implementación de Ciencia Abierta que no se encuentra respaldada por partidas presupuestarias específicas, requiriendo financiación adicional no contemplada en las partidas tradicionales.

**Actores clave.** Conselleria de Sanitat, comisiones de acceso abierto, direcciones de institutos y fundaciones, gerencias sanitarias, equipos de gestión e instancias de gobierno.

**Transformación requerida.** Consolidar un modelo de financiación sostenible con continuidad en el tiempo. Se requiere financiación directa y plural para el desarrollo de estrategias institucionales y la contratación de equipos técnicos especializados.

**Causas subyacentes.** Falta de prioridad política e institucional respecto a la asignación de recursos económicos específicos para este ámbito.`,source:"Apuntes de los grupos de trabajo · Informe de Resultados, §4.1",keyFinding:"Sin partidas específicas, la ciencia abierta depende del voluntarismo.",nextStepId:"w_intro"},{id:"w_estrategia",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:`**2 · Estrategia institucional de ciencia abierta**

**Diagnóstico actual.** Si bien se cuenta con marcos de referencia generales como la Estrategia Nacional de Ciencia Abierta (ENCA), existe una brecha en la adaptación e implementación concreta de dichos objetivos a la realidad operativa de cada institución.

**Actores clave.** Equipos dedicados exclusivamente a ciencia abierta y responsables institucionales con capacidad de decisión, trabajando coordinadamente en aspectos estratégicos, definición de indicadores, medición, formación, incentivos, gestión de talento y participación ciudadana.

**Transformación requerida.** Fomentar el intercambio de buenas prácticas e información entre entidades más avanzadas y el resto de las instituciones. Además, capacitar a todos los estamentos involucrados y fomentar un trabajo colaborativo continuo entre el personal especializado y el directivo.

**Causas subyacentes.** Dificultades para trasladar las políticas a la práctica, ausencia de roles responsables claramente asignados por falta de personal especializado y elevadas cargas de trabajo. Carencia de formación en cultura de apertura e incentivos al personal investigador.`,source:"Apuntes de los grupos de trabajo · Informe de Resultados, §4.2",keyFinding:"La ENCA existe; lo que falta es aterrizarla en cada institución.",nextStepId:"w_intro"},{id:"w_infraestructuras",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:`**3 · Infraestructuras tecnológicas adecuadas**

**Diagnóstico actual.** Predominio de esfuerzos aislados en la adquisición de infraestructuras tecnológicas, lo que genera capacidades dispares, duplicidad de recursos y una gestión fragmentada y no compartida entre centros de investigación.

**Actores clave.** Decisores de políticas públicas, direcciones de organizaciones y fundaciones de investigación, personal técnico e investigadores/as.

**Transformación requerida.** Definir directrices institucionales con planes de inversión y sostenibilidad a largo plazo. Promover un cambio cultural desde el enfoque individualista hacia uno colectivo, garantizando financiación para participar en foros colaborativos. Las infraestructuras no se orientan solo a la gestión de datos, sino a todo el ciclo de investigación.

**Causas subyacentes.** Avances institucionales a distintas velocidades por falta de directrices o estrategias colectivas estandarizadas, sumado a inercias de trabajo individualistas.`,source:"Apuntes de los grupos de trabajo · Informe de Resultados, §4.3",keyFinding:"El problema no es comprar herramientas: es compartirlas.",nextStepId:"w_intro"},{id:"w_gobernanza",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:`**4 · Gobernanza compartida y toma de decisiones colaborativas**

**Diagnóstico actual.** Los grupos de investigación suelen plantear sus proyectos y líneas de trabajo sin consultar formalmente con pacientes o asociaciones representativas para identificar sus prioridades y necesidades reales.

**Actores clave.** Investigadores/as, agencias evaluadoras de la investigación, asociaciones de pacientes, instituciones sanitarias y el Sistema Español de Ciencia y Tecnología.

**Transformación requerida.** Promover la investigación colaborativa desde sus fases iniciales con apoyo institucional y presupuestario, estableciendo puntos de contacto estables y espacios de diálogo con las asociaciones de pacientes.

**Causas subyacentes.** Inexistencia de marcos formales de gobernanza compartida, falta de concienciación y conocimiento sobre metodología participativa, y ausencia de estructuras organizativas consolidadas.`,source:"Apuntes de los grupos de trabajo · Informe de Resultados, §4.4",keyFinding:"La participación no empieza al final: empieza al definir la pregunta.",nextStepId:"w_intro"},{id:"w_next",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"Con los cuatro focos fijados, toca escuchar el cierre: **las conclusiones**."}]},{id:"station-conclusiones",section:"conclusiones",shortLabel:"Conclusiones",title:"6. Comentarios y conclusiones",subtitle:"Voces, aprendizajes y límites",worldX:9500,accessHeight:190,climb:"combo",color:{light:"rgba(255, 100, 125, 0.9)",dark:"rgba(255, 100, 125, 0.9)",accent:"#ff647d"},summary:"Las conclusiones del informe: superar el voluntarismo individual con financiación continuada, estrategia y estructura, coordinación e interoperabilidad, y gobernanza inclusiva.",dialogueRoot:[{id:"x_intro",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"Las conclusiones no son un resumen. Son lo que el taller cambió en quienes participaron, dicho con sus voces y con sus límites.",options:[{text:"Las cuatro claves",targetStepId:"x_claves"},{text:"La cita del informe",targetStepId:"x_cita"},{text:"Los límites",targetStepId:"x_limites"},{text:"Cerrar y seguir",targetStepId:"x_next"}]},{id:"x_claves",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:`El informe ordena el avance en cuatro claves:

**1 · Financiación continuada.** Partidas específicas para infraestructuras y personal técnico.

**2 · Estrategia y estructura.** Adecuación de la ENCA con equipos de gestión dedicados y roles definidos.

**3 · Coordinación e interoperabilidad.** Superación de la fragmentación tecnológica mediante directrices colectivas.

**4 · Gobernanza inclusiva.** Canales estructurados para la participación de pacientes y ciudadanía.`,source:"Síntesis del Informe de Resultados, §5",keyFinding:"Cuatro claves, una misma condición: pasar del esfuerzo individual al modelo institucional.",nextStepId:"x_intro"},{id:"x_cita",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"La frase que resume el diagnóstico del informe:",pullQuote:"Las evidencias recogidas destacan que el avance de la Ciencia Abierta en el sector sanitario requiere superar el voluntarismo individual e instituir un modelo basado en:",source:"Informe de Resultados, §5",nextStepId:"x_intro"},{id:"x_limites",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"Un informe honesto dice también lo que no pudo recoger. El taller dejó voces, aprendizajes y preguntas que todavía no están en el documento.",pending:"Citas literales de participantes, aprendizajes del equipo y límites del taller.",nextStepId:"x_intro"},{id:"x_next",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"El taller no termina en la sala: la última parada son **los pasos siguientes**."}]},{id:"station-siguientes",section:"pasos-siguientes",shortLabel:"Siguientes",title:"7. Pasos siguientes",subtitle:"Compromisos, materiales y continuidad",worldX:11300,accessHeight:255,climb:"climb_master_sky",color:{light:"rgba(99, 170, 22, 0.9)",dark:"rgba(99, 170, 22, 0.9)",accent:"#63aa16"},summary:"Los resultados alimentarán la hoja de ruta de OpenScience4Health y la reforma de la evaluación investigadora alineada con CoARA, como insumo directo a la Conselleria de Sanitat.",dialogueRoot:[{id:"y_intro",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"Un taller deja tareas. Esta estación reúne el destino del informe y lo que todavía falta por cerrar.",options:[{text:"El destino",targetStepId:"y_destino"},{text:"Compromisos y plazos",targetStepId:"y_compromisos"},{text:"Créditos y licencia",targetStepId:"y_creditos"},{text:"Terminar el recorrido",targetStepId:"y_end"}]},{id:"y_destino",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"El informe fija el destino: la Conselleria de Sanitat y la reforma de la evaluación investigadora alineada con CoARA.",pullQuote:"Los resultados aquí consolidados servirán de insumo directo a la Conselleria de Sanitat para orientar la reforma de la evaluación investigadora alineada con CoARA y el fortalecimiento del ecosistema público de I+D+i en salud.",source:"Informe de Resultados, §5",nextStepId:"y_intro"},{id:"y_compromisos",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"Lo que sí consta: las aportaciones alimentarán la **hoja de ruta del proyecto OpenScience4Health**. Lo que aún no consta: quién hace qué y para cuándo.",pending:"Compromisos concretos, responsables y fechas; kit de materiales para continuar.",nextStepId:"y_intro"},{id:"y_creditos",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:`Unidad de Ciencia Abierta de Fisabio. Proyecto **OpenScience4Health** (FCT-25-22602), coordinado con la UPV y la UV y financiado por la convocatoria I+P de FECYT.

Lo coordina Fisabio junto con la UPV y la UV, y lo financia la convocatoria I+P de la Fundación Española para la Ciencia y la Tecnología (FECYT).`,nextStepId:"p_intro"},{id:"p_unidad",speaker:"Unidad de Ciencia Abierta",role:"researcher",avatar:"flork",text:`El proyecto busca estandarizar las prácticas de ciencia abierta en la I+D+i en salud: mandatos y normas de acceso abierto y datos abiertos, indicadores cualitativos para los CRIS, financiación ascendente, apoyo a comunidades abiertas, servicios e infraestructuras, revisión de la evaluación de la investigación y deconstrucción de barreras legales y estructurales.

La sesión participativa fue la vía para escuchar qué hace falta, de viva voz, a quienes investigan, gestionan y deciden.`,nextStepId:"p_intro"},{id:"p_next",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"Cuando quieras, cierra este diálogo y camina hasta la siguiente baliza: **Contexto del taller**.",keyFinding:"Muévete con A/D, las flechas o los controles en pantalla."}]},{id:"station-taller",section:"contexto-taller",shortLabel:"Taller",title:"2. Contexto del taller",subtitle:"Cuándo, dónde y para qué",worldX:2300,color:{light:"rgba(255, 100, 125, 0.9)",dark:"rgba(255, 100, 125, 0.9)",accent:"#ff647d"},summary:"Sesión participativa con investigadores/as, gestores/as de la investigación y responsables de la toma de decisiones para diagnosticar qué necesita la ciencia abierta en la investigación sanitaria.",dialogueRoot:[{id:"t_intro",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"La sesión se organizó para responder a una pregunta: **¿qué necesitamos para que la Ciencia Abierta avance en la investigación sanitaria?** Desde la Unidad de Ciencia Abierta de Fisabio se reunió a investigadores/as, gestores/as de la investigación y responsables de la toma de decisiones.",options:[{text:"La pregunta y el objetivo",targetStepId:"t_objetivo"},{text:"Cómo se trabajó",targetStepId:"t_metodo"},{text:"Ficha del taller",targetStepId:"t_ficha"},{text:"Cerrar y seguir",targetStepId:"t_next"}]},{id:"t_ficha",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:`Ficha completa pendiente de confirmar: **[COMPLETAR: fecha, lugar, formato (presencial o híbrido), duración y convocatoria]**.

Lo que sí consta: la convocó la Unidad de Ciencia Abierta de Fisabio y fue una jornada con una segunda parte: la charla de **Enrique Orduña-Malea (UPV)** sobre cuánto cuesta investigar y la reunión del grupo de trabajo de **Documentación y Ciencia Abierta** impulsado por la Dirección General.`,nextStepId:"t_intro"},{id:"t_objetivo",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:`**Objetivo general:** construir un diagnóstico compartido entre investigadores, gestores de investigación y decisores públicos sobre las necesidades prioritarias para avanzar en la implantación de la Ciencia Abierta.

Para ello se buscó identificar: necesidades existentes y emergentes; prioridades compartidas; cómo se manifiestan las más relevantes; los factores que las explican; las condiciones necesarias para el cambio; los actores clave y las alianzas necesarias; y una visión compartida de futuro.`,nextStepId:"t_intro"},{id:"t_metodo",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:`**De barreras a necesidades.** Se diseñó un conjunto de necesidades y se llevaron a **tarjetas distinguidas por colores**, en seis bloques (25 necesidades en total, N01–N25). De ahí se eligieron las temáticas que los participantes consideraron más relevantes y, por votación, se trabajó sobre las más votadas.

**[COMPLETAR: dinámicas concretas, grupos de trabajo, materiales y tiempos por bloque.]**`,nextStepId:"t_intro"},{id:"t_next",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"Con la ficha clara, el siguiente paso es saber **quién estaba en la sala**."}]},{id:"station-participantes",section:"participantes",shortLabel:"Participantes",title:"3. Descripción de participantes",subtitle:"Quiénes y desde qué ámbitos",worldX:4100,elevated:!0,color:{light:"rgba(99, 170, 22, 0.9)",dark:"rgba(99, 170, 22, 0.9)",accent:"#63aa16"},summary:"Siete entidades interesadas en pensar estrategias de ciencia abierta con impacto en la sociedad: investigadores/as, gestores/as de la investigación y responsables de la toma de decisiones.",dialogueRoot:[{id:"u_intro",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"Un taller se entiende por quienes lo habitan. Se reunieron **siete entidades** interesadas en pensar estrategias de ciencia abierta que puedan impactar a la sociedad.",options:[{text:"Perfil de participantes",targetStepId:"u_perfil"},{text:"¿Cómo se convocó?",targetStepId:"u_convocatoria"},{text:"¿Quién no llegó?",targetStepId:"u_ausencias"},{text:"Cerrar y seguir",targetStepId:"u_next"}]},{id:"u_perfil",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:`**Siete entidades** interesadas en pensar estrategias de ciencia abierta con impacto en la sociedad.

**[COMPLETAR: número de asistentes, listado de las siete entidades y territorios.]**`,nextStepId:"u_intro"},{id:"u_convocatoria",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"**[COMPLETAR: cómo se convocó, por qué canales y con qué criterios de inclusión.]** El documento de contexto disponible no detalla la convocatoria.",nextStepId:"u_intro"},{id:"u_ausencias",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"**[COMPLETAR: qué voces no estuvieron y cómo se declara esa ausencia.]** El listado de las siete entidades aún no está en el material.",keyFinding:"Declarar ausencias también es parte del informe.",nextStepId:"u_intro"},{id:"u_next",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"Las personas traen temas. Eso es la siguiente parada: **las temáticas que trabajaron**."}]},{id:"station-tematicas",section:"tematicas-trabajadas",shortLabel:"Temáticas",title:"4. Temáticas que trabajaron",subtitle:"Lo que se puso sobre la mesa",worldX:5900,color:{light:"rgba(235, 0, 59, 0.9)",dark:"rgba(235, 0, 59, 0.9)",accent:"#eb003b"},summary:"25 necesidades en seis bloques —de gobernanza a participación ciudadana— antes de priorizar. Esta estación admite fotos del mural, tarjetas o actas.",dialogueRoot:[{id:"v_intro",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"Esta estación recoge los temas que se pusieron sobre la mesa, tal como aparecieron, antes de priorizar. El orden importa: primero se escucha, después se elige.",options:[{text:"¿Cómo se registraron?",targetStepId:"v_como"},{text:"Lista de temáticas",targetStepId:"v_lista"},{text:"Materiales del taller",targetStepId:"v_materiales"},{text:"Cerrar y seguir",targetStepId:"v_next"}]},{id:"v_como",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:`**De barreras a necesidades.** Se diseñó un conjunto de necesidades y se llevaron a **tarjetas distinguidas por colores**, agrupadas en seis bloques:

• **Gobernanza y cultura** — N01–N03
• **Recursos y capacidades** — N04–N06
• **Formación e infraestructuras** — N07–N10
• **Aspectos legales y éticos** — N11–N14
• **Incentivos y evaluación** — N15–N18
• **Participación ciudadana** — N19–N25

En total, **25 necesidades**.`,nextStepId:"v_intro"},{id:"v_lista",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:`De los seis bloques, los participantes eligieron las temáticas que consideraban más relevantes en su contexto:

• Estrategia institucional de ciencia abierta
• Financiación estable para impulsar la ciencia abierta
• Acceso equitativo a recursos e infraestructuras
• Infraestructuras tecnológicas adecuadas
• Interoperabilidad y estandarización de datos y sistemas
• Apoyo técnico para la preparación y anonimización de datos
• Orientación clara sobre protección de datos, propiedad intelectual y derechos de explotación
• Garantías para proteger la confidencialidad
• Procesos éticos y administrativos ágiles
• Reconocimiento de la ciencia abierta en la evaluación investigadora
• Incentivos para compartir resultados y recursos
• Estructuras estables de participación ciudadana
• Gobernanza compartida y toma de decisiones colaborativas`,keyFinding:"13 temáticas relevantes de un total de 25 necesidades.",nextStepId:"v_intro"},{id:"v_materiales",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"[COMPLETAR: aquí entrarán fotos, vídeo o audio del taller. El motor ya admite imagen, vídeo y audio con pie de foto, crédito, subtítulos y transcripción.]",keyFinding:"Los recursos se cargan en public/media y se declaran en el modelo StationMedia.",nextStepId:"v_intro"},{id:"v_next",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"No todo cabe. La siguiente estación explica **qué se seleccionó y por qué**."}]},{id:"station-prioridades",section:"tematicas-seleccionadas",shortLabel:"Prioridades",title:"5. Temáticas seleccionadas y focos",subtitle:"De la lista larga a los focos de trabajo",worldX:7700,color:{light:"rgba(29, 15, 68, 0.9)",dark:"rgba(29, 15, 68, 0.9)",accent:"#1d0f44"},summary:"De las 13 temáticas relevantes se votaron las más prioritarias. El taller trabajó cuatro focos con un mismo esquema: qué pasa, quién es clave, qué tendría que cambiar y por qué ocurre.",dialogueRoot:[{id:"w_intro",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"Del conjunto de temas, el taller seleccionó algunos focos. Un buen informe muestra el criterio de selección, no solo la lista final.",options:[{text:"Criterios de selección",targetStepId:"w_criterios"},{text:"Focos elegidos",targetStepId:"w_focos"},{text:"¿Qué quedó fuera?",targetStepId:"w_fuera"},{text:"Cerrar y seguir",targetStepId:"w_next"}]},{id:"w_criterios",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"El mecanismo consta: **votación** de las temáticas que los participantes consideraron más relevantes dentro de su contexto. **[COMPLETAR: criterios explícitos de priorización — urgencia, viabilidad, acuerdo, recursos.]** El documento disponible no los detalla.",nextStepId:"w_intro"},{id:"w_focos",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:`**1 · Financiación estable para impulsar la ciencia abierta.** Qué está pasando: se demandan partidas adicionales de la C.A.B. Quién es clave: Conselleria, comisiones de OA, directivas, gerencias y gestión y gobierno. Qué tendría que cambiar: un modelo de financiación con continuidad específica, financiación directa y plural para desarrollar estrategias y equipos. Por qué ocurre: falta de dinero, de prioridad y de recursos económicos.

**2 · Estrategia institucional de ciencia abierta.** Existe una estrategia nacional (ENCA), pero falta adaptar y aterrizar los objetivos a cada institución y contar con recursos humanos. Quién es clave: un equipo dedicado a la ciencia abierta junto a quienes tienen poder de decisión. Qué tendría que cambiar: compartir información y buenas prácticas entre instituciones, formar a todas las partes y trabajar de forma conjunta entre personal especializado y directivo. Por qué ocurre: lo definido no siempre se lleva a la práctica, faltan responsables claros, recursos humanos especializados y tiempo; falta formación e incentivos.

**3 · Infraestructuras tecnológicas adecuadas.** Qué está pasando: esfuerzos aislados, capacidades distintas, gestión y explotación desigual y duplicidad de recursos. Quién es clave: decisores de políticas, dirección de las organizaciones, instituciones, fundaciones, equipos técnicos e investigadores. Qué tendría que cambiar: directrices con plan de inversión y sostenibilidad; cambio cultural de lo individual a lo colectivo; financiación para foros colaborativos. Por qué ocurre: avances a distintas velocidades sin directrices colectivas y estandarizadas; individualismo. Añadido: las infraestructuras no solo se dirigen a la gestión de datos.

**4 · Gobernanza compartida y toma de decisiones colaborativas.** Qué está pasando: hay grupos que plantean sus proyectos sin consultar con pacientes y asociaciones. Quién es clave: investigadores, agencias evaluadoras, asociaciones de pacientes, instituciones y el sistema español de ciencia y tecnología. Qué tendría que cambiar: investigar con apoyo institucional y financiación, y crear espacios de conversación y puntos de contacto con las asociaciones. Por qué ocurre: falta de gobernanza, de conocimiento y concienciación, y de estructuras establecidas.`,keyFinding:"Cuatro focos, un mismo esquema de análisis.",nextStepId:"w_intro"},{id:"w_fuera",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"**[COMPLETAR: qué quedó fuera y por qué.]** El documento disponible registra las 13 temáticas relevantes y los cuatro focos trabajados, pero no las descartadas.",keyFinding:"Un informe honesto dice también lo que no pasó.",nextStepId:"w_intro"},{id:"w_next",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"Con los focos fijados, toca escuchar el cierre: **comentarios y conclusiones**."}]},{id:"station-conclusiones",section:"conclusiones",shortLabel:"Conclusiones",title:"6. Comentarios y conclusiones",subtitle:"Voces, aprendizajes y límites",worldX:9500,color:{light:"rgba(255, 100, 125, 0.9)",dark:"rgba(255, 100, 125, 0.9)",accent:"#ff647d"},summary:"Las conclusiones del taller: estrategias institucionales, financiación estable, infraestructuras tecnológicas adecuadas y mecanismos de adopción de prácticas abiertas.",dialogueRoot:[{id:"x_intro",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"Las conclusiones no son un resumen. Son lo que el taller cambió en quienes participaron, dicho con sus voces y con sus límites.",options:[{text:"Voces de participantes",targetStepId:"x_voces"},{text:"Aprendizajes",targetStepId:"x_aprendizajes"},{text:"Límites y preguntas abiertas",targetStepId:"x_limites"},{text:"Cerrar y seguir",targetStepId:"x_next"}]},{id:"x_voces",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"**[COMPLETAR: dos o tres citas literales de participantes, con permiso y atribución.]** El documento disponible resume las conclusiones, pero no recoge citas textuales.",nextStepId:"x_intro"},{id:"x_aprendizajes",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:`Entre las principales conclusiones recogidas destacan cuatro: la necesidad de contar con **estrategias institucionales de ciencia abierta**, **financiación estable**, **infraestructuras tecnológicas adecuadas** y **mecanismos que favorezcan la adopción de prácticas abiertas** en la investigación sanitaria.

**[COMPLETAR: aprendizajes del equipo organizador.]**`,nextStepId:"x_intro"},{id:"x_limites",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"**[COMPLETAR: límites del taller, sesgos y preguntas que quedaron abiertas.]** El documento se corta en el apartado «Conclusiones/Comentarios», así que aún no constan.",nextStepId:"x_intro"},{id:"x_next",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"El taller no termina en la sala: la última parada son **los pasos siguientes**."}]},{id:"station-siguientes",section:"pasos-siguientes",shortLabel:"Siguientes",title:"7. Pasos siguientes",subtitle:"Compromisos, materiales y continuidad",worldX:11300,color:{light:"rgba(99, 170, 22, 0.9)",dark:"rgba(99, 170, 22, 0.9)",accent:"#63aa16"},summary:"Las aportaciones recogidas alimentarán una estrategia y una hoja de ruta compartidas para fortalecer la Ciencia Abierta en salud.",dialogueRoot:[{id:"y_intro",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"Un taller deja tareas. Esta estación reúne compromisos, responsables y plazos, y el kit para quien quiera continuar.",options:[{text:"Compromisos y plazos",targetStepId:"y_compromisos"},{text:"Kit para continuar",targetStepId:"y_kit"},{text:"Créditos y licencia",targetStepId:"y_creditos"},{text:"Terminar el recorrido",targetStepId:"y_end"}]},{id:"y_compromisos",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:`**[COMPLETAR: compromisos, responsables y fechas.]**

**[COMPLETAR: equipo, colaboradores y licencia de los contenidos.]**`,nextStepId:"y_intro"},{id:"y_end",speaker:"Guía del taller",role:"narrator",avatar:"flork",text:"Fin del recorrido. Puedes volver a cualquier estación desde la barra superior.",keyFinding:"Gracias por explorar el taller."}]}]},jm=Object.freeze(Object.defineProperty({__proto__:null,articleFisabioTaller:wm},Symbol.toStringTag,{value:"Module"}));</script>
